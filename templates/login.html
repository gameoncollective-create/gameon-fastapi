<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameOn Collective | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Poppins',sans-serif;background:#0a0a0a;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
        .card{background:#1f2937;border-radius:24px;padding:40px;width:100%;max-width:420px;border:1px solid rgba(249,115,22,0.3)}
        .logo{font-family:'Anton',sans-serif;font-size:1.5rem;color:#f97316;margin-bottom:8px}
        h1{font-family:'Anton',sans-serif;font-size:2rem;margin-bottom:5px}
        .subtitle{color:#9ca3af;font-size:0.85rem;margin-bottom:30px}
        label{display:block;font-size:0.8rem;color:#9ca3af;margin-bottom:6px;margin-top:18px}
        input{width:100%;padding:13px 16px;background:#0a0a0a;border:1px solid #374151;border-radius:10px;color:#fff;font-family:'Poppins',sans-serif;font-size:0.9rem}
        input:focus{outline:none;border-color:#f97316}
        .btn{width:100%;background:#f97316;border:none;padding:14px;border-radius:10px;color:#0a0a0a;font-weight:700;font-size:1rem;cursor:pointer;margin-top:24px}
        .btn:hover{background:#ea580c}
        .error{background:rgba(239,68,68,0.15);border:1px solid #ef4444;color:#ef4444;padding:12px;border-radius:10px;margin-bottom:15px;font-size:0.85rem}
        .footer-link{text-align:center;margin-top:20px;font-size:0.8rem;color:#9ca3af}
        .footer-link a{color:#f97316;text-decoration:none}
        .back{display:block;text-align:center;margin-top:15px;color:#6b7280;font-size:0.8rem;text-decoration:none}
        .back:hover{color:#f97316}
    </style>
</head>
<body>
<div class="card">
    <div class="logo">GAMEON COLLECTIVE</div>
    <h1>Welcome Back</h1>
    <div class="subtitle">Sign in to access your dashboard</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="you@example.com" required>
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
        <button type="submit" class="btn">SIGN IN →</button>
    </form>
    <div class="footer-link">Don't have an account? <a href="/register">Register</a></div>
    <a href="/" class="back">← Back to Dashboard</a>
</div>
</body>
</html>
